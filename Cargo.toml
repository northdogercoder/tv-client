[package]
name = "tv-client"
version = "0.1.6"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[features]
native-ui = ["dep:slint"]
gstreamer-player = ["dep:gstreamer", "dep:gstreamer-video", "dep:gstreamer-audio"]
player-overlay = ["gstreamer-player", "dep:slint"]
cec = []
airplay = []
webrtc = []

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
gstreamer = { version = "0.25.4", optional = true }
gstreamer-audio = { version = "0.25.4", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
reqwest = "0.13.5"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.19.1", optional = true, default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "std",
] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "1"
tracing = "0.1"
url = "2"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
uuid = { version = "1", features = ["serde", "v4"] }

[build-dependencies]
slint-build = { version = "1.19.1", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tv-native-player"
path = "src/bin/tv-native-player.rs"
required-features = ["gstreamer-player"]
