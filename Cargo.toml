[package]
name = "tv-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[features]
native-ui = []
gstreamer-player = ["dep:gstreamer", "dep:gstreamer-video", "dep:gstreamer-audio"]
cec = []
airplay = []
webrtc = []

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
gstreamer = { version = "0.25.4", optional = true }
gstreamer-audio = { version = "0.25.4", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
reqwest = "0.13.5"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
toml = "1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tv-native-player"
path = "src/bin/tv-native-player.rs"
required-features = ["gstreamer-player"]
