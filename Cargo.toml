[package]
name = "tv-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[features]
native-ui = []
gstreamer-player = []
cec = []
airplay = []
webrtc = []

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
reqwest = "0.13.5"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
